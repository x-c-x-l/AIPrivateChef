[project]
name = "aiprivatechef"
version = "0.1.0"
description = "AI 私人厨师 - 基于 LangChain + FastAPI 的智能食谱推荐助手"
requires-python = ">=3.13"
dependencies = [
    "alibabacloud-oss-v2>=1.3.1",
    "bcrypt>=5.0.0",
    "dbutils>=3.1.2",
    "fastapi>=0.138.2",
    "httpx>=0.27.0",
    "langchain>=1.3.11",
    "langchain-core>=1.4.8",
    "langchain-deepseek>=1.1.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.6",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langgraph-cli[inmem]>=0.4.30",
    "openai>=2.43.0",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
